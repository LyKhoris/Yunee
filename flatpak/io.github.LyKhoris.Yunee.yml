# Flatpak manifest for Yunee — a local, single-user Canvas LMS client for GNOME.
#
# Build and install for the current user:
#
#   flatpak-builder --user --install --force-clean build-dir \
#       flatpak/io.github.LyKhoris.Yunee.yml
#
# Build a single-file bundle for a GitHub release:
#
#   flatpak-builder --user --force-clean --repo=repo build-dir \
#       flatpak/io.github.LyKhoris.Yunee.yml
#   flatpak build-bundle repo yunee.flatpak io.github.LyKhoris.Yunee
#
# Runtime: org.gnome.Platform//51 ships GTK 4.24 and libadwaita 1.10, which
# satisfy the >= 4.22 / >= 1.9 features Cargo.toml pins.
#
# NOTE: this build fetches crates from crates.io during the build (flatpak-builder
# allows network). Submitting to Flathub would require vendoring the crates into
# `cargo-sources.json` and building offline; that is not done here.

app-id: io.github.LyKhoris.Yunee
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: yunee

finish-args:
  # Display
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Canvas syncing over HTTPS
  - --share=network
  # Desktop notifications and the GNOME keyring (Canvas personal access token)
  - --talk-name=org.freedesktop.notifications
  - --talk-name=org.freedesktop.secrets
  # Saving files downloaded from Canvas
  - --filesystem=xdg-download

modules:
  - name: yunee
    buildsystem: simple
    build-options:
      # rust-stable is an SDK extension, not on PATH by default.
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/yunee/cargo
        CARGO_NET_OFFLINE: 'true'
        # aws-lc-sys (via rustls) otherwise compiles its jitterentropy source,
        # which refuses to build with the -O2 that the SDK's CFLAGS impose.
        # Linux gets randomness from getrandom anyway.
        AWS_LC_SYS_NO_JITTER_ENTROPY: '1'
    build-commands:
      # The build sandbox has no network, so crates are vendored (see
      # `cargo vendor vendor`, run before building — and in CI).
      - mkdir -p .cargo
      - printf '[source.crates-io]\nreplace-with = "vendored-sources"\n\n[source.vendored-sources]\ndirectory = "vendor"\n' > .cargo/config.toml
      - cargo build --release --locked --offline --manifest-path Cargo.toml
      - install -Dm755 target/release/yunee /app/bin/yunee
      - install -Dm644 data/io.github.LyKhoris.Yunee.desktop /app/share/applications/io.github.LyKhoris.Yunee.desktop
      - install -Dm644 data/io.github.LyKhoris.Yunee.metainfo.xml /app/share/metainfo/io.github.LyKhoris.Yunee.metainfo.xml
      - install -Dm644 data/io.github.LyKhoris.Yunee.svg /app/share/icons/hicolor/scalable/apps/io.github.LyKhoris.Yunee.svg
    sources:
      # The Cargo workspace (Cargo.toml, Cargo.lock, crates/, data/) plus the
      # vendored crates in vendor/. Paths are relative to this manifest, which
      # lives in flatpak/.
      - type: dir
        path: ..
        skip:
          - .git
          - target
          - build-dir
          - repo
          - .flatpak-builder
          - flatpak
