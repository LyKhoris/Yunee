name: Publish Flatpak

# Builds and signs the Flatpak update files. Pages hosts those files only;
# the desktop app is not deployed or run there. No releases or tags are created.
# gh workflow run publish.yml --ref main -f version=0.1.0-beta.7
# Requires FLATPAK_GPG_KEY and Pages enabled on the gh-pages branch.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "App version (e.g. 0.1.0-beta.7)"
        required: true
        type: string

# Only one publisher may replace the update repository at a time.
concurrency:
  group: flatpak-publish
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUILD_VERSION: ${{ inputs.version }}
  APP_ID: io.github.LyKhoris.Yunee
  PAGES_URL: https://lykhoris.github.io/Yunee

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gnupg

      - name: Add Flathub (user)
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # The Flatpak build sandbox has no network, so crates must be vendored.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate and stamp the version
        run: |
          set -euo pipefail
          version="$BUILD_VERSION"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]] || {
            echo "::error::invalid app version"
            exit 1
          }
          date="$(date -u +%Y-%m-%d)"
          sed -i "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml
          sed -i \
            "s#<release version=\"[^\"]*\" date=\"[^\"]*\">#<release version=\"${version}\" date=\"${date}\">#" \
            data/io.github.LyKhoris.Yunee.metainfo.xml
          cargo update --workspace

      # Import the repo signing key. It signs both the exported commits and the
      # repo summary; clients verify updates against the public half, which is
      # embedded in the .flatpakref.
      - name: Import the signing key
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "${{ secrets.FLATPAK_GPG_KEY }}" | base64 -d | gpg --batch --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          test -n "$keyid" || { echo "::error::no signing key imported"; exit 1; }
          echo "KEYID=$keyid" >> "$GITHUB_ENV"
          gpg --list-secret-keys --keyid-format=long

      - name: Vendor crates
        run: cargo vendor vendor

      - name: Build the Flatpak
        run: |
          flatpak-builder --user --force-clean \
            --gpg-sign="$KEYID" \
            --default-branch=stable \
            --install-deps-from=flathub \
            --repo=repo build-dir flatpak/io.github.LyKhoris.Yunee.yml

      # Regenerate the summary (signed) and the appstream branch.
      - name: Sign the repository
        run: flatpak build-update-repo --gpg-sign="$KEYID" repo

      - name: Generate the .flatpakref
        run: |
          gpg --export --armor "$KEYID" | base64 -w0 > pubkey.b64
          {
            echo '[Flatpak Ref]'
            echo 'Title=Yunee'
            echo "Name=${APP_ID}"
            echo 'Branch=stable'
            echo "Url=${PAGES_URL}/"
            echo 'RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo'
            echo 'IsRuntime=false'
            printf 'GPGKey=%s\n' "$(cat pubkey.b64)"
          } > "${APP_ID}.flatpakref"
          echo "wrote ${APP_ID}.flatpakref"

      # Publish the OSTree repo and the .flatpakref to the gh-pages branch.
      # GitHub Pages serves them at PAGES_URL.
      - name: Publish the repository to GitHub Pages
        run: |
          cp "${APP_ID}.flatpakref" repo/
          touch repo/.nojekyll
          cd repo
          git init -q -b gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- .
          git commit -qm "Publish ${APP_ID} $BUILD_VERSION"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
