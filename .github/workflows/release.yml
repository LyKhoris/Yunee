name: Release

# Builds the Flatpak and attaches the bundle to a GitHub release.
#
# Push a tag (e.g. `git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1`).
#
# Auto-updates are not wired up yet: a Flatpak repository needs a public home
# (GitHub Pages needs a public repo, or Flathub). Until then, users install the
# bundle from the release and re-download to update.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub (user)
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # The Flatpak build sandbox has no network, so crates must be vendored.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Vendor crates
        run: cargo vendor vendor

      - name: Build the Flatpak
        run: |
          flatpak-builder --user --force-clean \
            --install-deps-from=flathub \
            --repo=repo build-dir flatpak/io.github.LyKhoris.Yunee.yml
          flatpak build-bundle repo "yunee-${GITHUB_REF_NAME#v}.flatpak" \
            io.github.LyKhoris.Yunee

      - name: Upload the bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: yunee-flatpak
          path: "*.flatpak"
          if-no-files-found: error

      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.flatpak"
          prerelease: true
          generate_release_notes: true
