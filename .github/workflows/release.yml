name: Release

# Builds the Flatpak, publishes a signed OSTree repo to GitHub Pages, and
# attaches the bundle + .flatpakref to a GitHub release.
#
# Push a tag (e.g. `git tag v0.1.0-beta.5 && git push origin v0.1.0-beta.5`).
#
# Users install once from the signed repo:
#
#   flatpak install --from https://lykhoris.github.io/Yunee/io.github.LyKhoris.Yunee.flatpakref
#
# and update with `flatpak update` / GNOME Software from then on.
#
# Requires: the FLATPAK_GPG_KEY secret (base64 of the ASCII-armored secret key,
# see flatpak/README.md) and GitHub Pages enabled on the gh-pages branch.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_ID: io.github.LyKhoris.Yunee
  PAGES_URL: https://lykhoris.github.io/Yunee

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder gnupg

      - name: Add Flathub (user)
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # The Flatpak build sandbox has no network, so crates must be vendored.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The version comes from the tag, so it is only meaningful for tag builds.
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Stamp the tag into the workspace version and the AppStream release, so
      # every bundle is a distinct version. On workflow_dispatch (no tag) the
      # committed version is used as-is.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          date="$(date -u +%Y-%m-%d)"
          sed -i "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml
          sed -i \
            "s#<release version=\"[^\"]*\" date=\"[^\"]*\">#<release version=\"${version}\" date=\"${date}\">#" \
            data/io.github.LyKhoris.Yunee.metainfo.xml
          # Keep the lockfile in step with the new workspace versions, or the
          # offline `--locked` build below refuses to run.
          cargo update --workspace
          echo "Stamped version ${version}:"
          grep -n '^version' Cargo.toml
          grep -n '<release ' data/io.github.LyKhoris.Yunee.metainfo.xml

      # Import the repo signing key. It signs both the exported commits and the
      # repo summary; clients verify updates against the public half, which is
      # embedded in the .flatpakref.
      - name: Import the signing key
        run: |
          mkdir -p ~/.gnupg && chmod 700 ~/.gnupg
          echo "${{ secrets.FLATPAK_GPG_KEY }}" | base64 -d | gpg --batch --import
          keyid="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')"
          test -n "$keyid" || { echo "::error::no signing key imported"; exit 1; }
          echo "KEYID=$keyid" >> "$GITHUB_ENV"
          gpg --list-secret-keys --keyid-format=long

      - name: Vendor crates
        run: cargo vendor vendor

      - name: Build the Flatpak
        run: |
          flatpak-builder --user --force-clean \
            --gpg-sign="$KEYID" \
            --default-branch=stable \
            --install-deps-from=flathub \
            --repo=repo build-dir flatpak/io.github.LyKhoris.Yunee.yml

      # Regenerate the summary (signed) and the appstream branch.
      - name: Sign the repository
        run: flatpak build-update-repo --gpg-sign="$KEYID" repo

      # A standalone bundle is still attached for offline installs. Bundles do
      # not update in place; the repo above is the update path. Built before the
      # publish step so `git init` never runs inside the OSTree repo.
      - name: Build the single-file bundle
        run: |
          flatpak build-bundle repo "yunee-${{ steps.version.outputs.version }}.flatpak" \
            "${APP_ID}" stable

      - name: Generate the .flatpakref
        run: |
          gpg --export --armor "$KEYID" | base64 -w0 > pubkey.b64
          {
            echo '[Flatpak Ref]'
            echo 'Title=Yunee'
            echo "Name=${APP_ID}"
            echo 'Branch=stable'
            echo "Url=${PAGES_URL}/"
            echo 'RuntimeRepo=https://flathub.org/repo/flathub.flatpakrepo'
            echo 'IsRuntime=false'
            printf 'GPGKey=%s\n' "$(cat pubkey.b64)"
          } > "${APP_ID}.flatpakref"
          echo "wrote ${APP_ID}.flatpakref"

      # Publish the OSTree repo and the .flatpakref to the gh-pages branch.
      # GitHub Pages serves them at PAGES_URL.
      - name: Publish the repository to GitHub Pages
        run: |
          cp "${APP_ID}.flatpakref" repo/
          touch repo/.nojekyll
          cd repo
          git init -q -b gh-pages
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -qm "Publish ${APP_ID} ${{ steps.version.outputs.version }}"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yunee-flatpak
          path: |
            *.flatpak
            *.flatpakref
          if-no-files-found: error

      - name: Attach the artifacts to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.flatpak
            *.flatpakref
          prerelease: true
          generate_release_notes: true
          body: |
            ## Install / update

            Install once from the signed repository; updates are then normal:

            ```sh
            # First install
            flatpak install --from ${{ env.PAGES_URL }}/${{ env.APP_ID }}.flatpakref

            # Later updates
            flatpak update
            ```

            A standalone `yunee-${{ steps.version.outputs.version }}.flatpak` is attached
            for offline installs, but bundles do not update in place.

            Requires `org.gnome.Platform//51`.
