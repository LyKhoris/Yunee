name: Release

# Builds the Flatpak and attaches the bundle to a GitHub release.
#
# Push a tag (e.g. `git tag v0.1.0-beta.4 && git push origin v0.1.0-beta.4`).
#
# Distribution is bundle-only and private: there is no Flatpak repository and no
# remote. A `.flatpak` bundle is an installer, not an update channel — GNOME
# Software shows an installed app as installed and never compares versions, and
# `flatpak install` refuses a bundle whose commit is already present. Updating is
# an explicit reinstall:
#
#   flatpak install --user --reinstall yunee-<version>.flatpak
#
# The bundle's version is stamped from the tag below, so each release carries a
# distinct version in both the app's Settings row and the Flatpak metadata.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub (user)
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # The Flatpak build sandbox has no network, so crates must be vendored.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The version comes from the tag, so it is only meaningful for tag builds.
      - name: Resolve version
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Stamp the tag into the workspace version and the AppStream release, so
      # every bundle is a distinct version. On workflow_dispatch (no tag) the
      # committed version is used as-is.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          date="$(date -u +%Y-%m-%d)"
          sed -i "s/^version = \".*\"/version = \"${version}\"/" Cargo.toml
          sed -i \
            "s#<release version=\"[^\"]*\" date=\"[^\"]*\">#<release version=\"${version}\" date=\"${date}\">#" \
            data/io.github.LyKhoris.Yunee.metainfo.xml
          # Keep the lockfile in step with the new workspace versions, or the
          # offline `--locked` build below refuses to run.
          cargo update --workspace
          echo "Stamped version ${version}:"
          grep -n '^version' Cargo.toml
          grep -n '<release ' data/io.github.LyKhoris.Yunee.metainfo.xml

      - name: Vendor crates
        run: cargo vendor vendor

      - name: Build the Flatpak
        run: |
          flatpak-builder --user --force-clean \
            --install-deps-from=flathub \
            --repo=repo build-dir flatpak/io.github.LyKhoris.Yunee.yml
          flatpak build-bundle repo "yunee-${{ steps.version.outputs.version }}.flatpak" \
            io.github.LyKhoris.Yunee

      - name: Upload the bundle as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: yunee-flatpak
          path: "*.flatpak"
          if-no-files-found: error

      # `body` is pre-pended to the generated notes. Bundles do not update in
      # place, so the update command is the whole point of this section.
      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.flatpak"
          prerelease: true
          generate_release_notes: true
          body: |
            ## Install / update

            Yunee ships as a Flatpak bundle. Bundles install but never update in
            place, so installing over an existing copy needs `--reinstall`:

            ```sh
            # First install
            flatpak install --user yunee-${{ steps.version.outputs.version }}.flatpak

            # Update an existing install
            flatpak install --user --reinstall yunee-${{ steps.version.outputs.version }}.flatpak
            ```

            Requires `org.gnome.Platform//51`.
