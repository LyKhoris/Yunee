name: Release

# Builds the Flatpak, attaches the bundle to a GitHub release, and publishes a
# Flatpak repository to GitHub Pages so installed copies auto-update.
#
# Push a tag (e.g. `git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1`).
#
# Users install once:
#   flatpak remote-add --if-not-exists --no-gpg-verify yunee \
#       https://<owner>.github.io/<repo>/yunee.flatpakrepo
#   flatpak install yunee io.github.LyKhoris.Yunee
# ...and from then on `flatpak update` / GNOME Software keeps it current.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  flatpak:
    name: Build Flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder

      - name: Add Flathub
        run: |
          sudo flatpak remote-add --if-not-exists flathub \
            https://flathub.org/repo/flathub.flatpakrepo

      # The Flatpak build sandbox has no network, so crates must be vendored.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Vendor crates
        run: cargo vendor vendor

      - name: Build the Flatpak into an OSTree repo
        run: |
          flatpak-builder --user --force-clean \
            --install-deps-from=flathub \
            --repo=repo build-dir flatpak/io.github.LyKhoris.Yunee.yml
          flatpak build-update-repo repo \
            --title="Yunee" \
            --comment="Local, single-user Canvas client for GNOME" \
            --default-branch=master

      - name: Bundle for the release
        run: |
          flatpak build-bundle repo "yunee-${GITHUB_REF_NAME:-dev}.flatpak" \
            io.github.LyKhoris.Yunee

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: yunee-flatpak
          path: "*.flatpak"
          if-no-files-found: error

      - name: Upload the Flatpak repo
        uses: actions/upload-artifact@v4
        with:
          name: yunee-repo
          path: repo
          if-no-files-found: error

      - name: Attach the bundle to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: "*.flatpak"
          prerelease: true
          generate_release_notes: true

  pages:
    name: Publish Flatpak repo
    needs: flatpak
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: yunee-repo
          path: public/repo

      - name: Write the .flatpakrepo file
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO="${GITHUB_REPOSITORY#*/}"
          mkdir -p public
          cat > public/yunee.flatpakrepo <<EOF
          [Flatpak Repo]
          Title=Yunee
          Url=https://${OWNER,,}.github.io/${REPO}/repo/
          Homepage=https://github.com/${GITHUB_REPOSITORY}
          Comment=Local, single-user Canvas client for GNOME
          Description=Yunee is a local, single-user Canvas client for GNOME: courses, assignments, announcements, modules, files and grades, synced to a local SQLite database. No account, no hosting.
          Icon=https://${OWNER,,}.github.io/${REPO}/repo/
          EOF

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
