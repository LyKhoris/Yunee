name: Backup

# Nightly dump of the live Turso database, kept as a workflow artifact.
#
# The dump contains live member tokens, so it is deliberately NOT committed to
# the repo. Artifacts are private to this repository and expire after 90 days.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   TURSO_DATABASE_URL
#   TURSO_AUTH_TOKEN

on:
  schedule:
    # 09:00 UTC daily (= ~02:00 in Los Angeles).
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Dump the database
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: npm run backup

      - name: Prove the dump restores
        run: npm run restore

      - uses: actions/upload-artifact@v4
        with:
          name: yunee-backup-${{ github.run_number }}
          path: backups/*.sql
          retention-days: 90
          if-no-files-found: error
